<div
  class="input-container"
  [class.input-container--inline]="labelPosition() === 'before' || labelPosition() === 'after'"
>
  @if (label() && labelPosition() === 'above') {
    <label [for]="id()" [id]="getLabelElementId()" class="field-label" [ngClass]="labelClasses">
      {{ label() }}
    </label>
  }

  <div
    class="input-main"
    [class.input-main--inline]="labelPosition() === 'before' || labelPosition() === 'after'"
  >
    @if (label() && labelPosition() === 'before') {
      <label
        [for]="id()"
        [id]="getLabelElementId()"
        class="field-label field-label--inline field-label--before"
        [ngClass]="labelClasses"
      >
        {{ label() }}
      </label>
    }

    <div class="input-control">
      <ng-content></ng-content>
    </div>

    @if (label() && labelPosition() === 'after') {
      <label
        [for]="id()"
        [id]="getLabelElementId()"
        class="field-label field-label--inline field-label--after"
        [ngClass]="labelClasses"
      >
        {{ label() }}
      </label>
    }
  </div>

  @if (label() && labelPosition() === 'below') {
    <label
      [for]="id()"
      [id]="getLabelElementId()"
      class="field-label field-label--below"
      [ngClass]="labelClasses"
    >
      {{ label() }}
    </label>
  }

  @if (helpText() && !errorText()) {
    <span
      [id]="getHelpTextElementId()"
      class="field-message field-message--help"
      aria-live="polite"
    >
      <ui-icon
        class="field-message__icon"
        icon="info"
        [sizePx]="messageIconSizePx"
        variant="regular"
      />
      <span class="field-message__text">{{ helpText() }}</span>
    </span>
  }

  @if (errorText()) {
    <span
      [id]="getErrorTextElementId()"
      class="field-message field-message--error"
      aria-live="polite"
      role="alert"
    >
      <ui-icon
        class="field-message__icon"
        icon="error_circle"
        [sizePx]="messageIconSizePx"
        variant="filled"
      />
      <span class="field-message__text">{{ errorText() }}</span>
    </span>
  }
</div>
