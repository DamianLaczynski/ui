name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./packages/lui/package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::packages/lui version ($PKG_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Test
        run: |
          npm ci
          npm run lint
          npm run build:lib
          npx ng test ui-showcase --watch=false
          npx tsc -p packages/lui/tsconfig.spec.json --noEmit
          npx ng test lui --watch=false

      - name: Publish to npmjs.com
        working-directory: dist/lui
        run: |
          npm install -g npm@latest
          NPM_CONFIG_USERCONFIG="${RUNNER_TEMP}/.npmrc"
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          printf "registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n" "$OIDC_TOKEN" > "$NPM_CONFIG_USERCONFIG"
          export NPM_CONFIG_USERCONFIG
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG=preview
          else
            NPM_TAG=latest
          fi
          npm publish --access public --tag "$NPM_TAG" --provenance

      - name: Publish to GitHub Packages
        working-directory: dist/lui
        run: |
          NPM_CONFIG_USERCONFIG="${RUNNER_TEMP}/.npmrc-ghp"
          printf "@laczynski:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n" "${{ secrets.GITHUB_TOKEN }}" > "$NPM_CONFIG_USERCONFIG"
          export NPM_CONFIG_USERCONFIG
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG=preview
          else
            NPM_TAG=latest
          fi
          npm publish --tag "$NPM_TAG"

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if node scripts/extract-changelog.mjs "$VERSION" > release-notes.md 2>/dev/null; then
            echo "source=changelog" >> "$GITHUB_OUTPUT"
          elif [ -f ".github/release-notes/${GITHUB_REF_NAME}.md" ]; then
            echo "source=file" >> "$GITHUB_OUTPUT"
          else
            echo "source=generated" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release (from CHANGELOG)
        if: steps.notes.outputs.source == 'changelog'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md

      - name: GitHub Release (from release notes file)
        if: steps.notes.outputs.source == 'file'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: .github/release-notes/${{ github.ref_name }}.md

      - name: GitHub Release (auto-generated)
        if: steps.notes.outputs.source == 'generated'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
